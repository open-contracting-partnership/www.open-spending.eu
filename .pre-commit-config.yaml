ci:
  autoupdate_schedule: quarterly
repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.2
    hooks:
      - id: biome-check
  - repo: local
    hooks:
      - id: phpcbf
        name: phpcbf
        entry: vendor/bin/phpcbf
        language: system
        types: [php]
      - id: phpcs
        name: phpcs
        entry: vendor/bin/phpcs
        language: system
        types: [php]
