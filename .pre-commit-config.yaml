ci:
  autoupdate_schedule: quarterly
repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.2
    hooks:
      - id: biome-check
  - repo: local
    hooks:
      - id: phpcbf
        name: phpcbf (auto-fix WordPress coding standard)
        entry: vendor/bin/phpcbf
        language: system
        types: [php]
        exclude: '^(vendor|dist|node_modules|acf_json|dev)/'
      - id: phpcs
        name: phpcs (verify WordPress coding standard)
        entry: vendor/bin/phpcs
        language: system
        types: [php]
        exclude: '^(vendor|dist|node_modules|acf_json|dev)/'
