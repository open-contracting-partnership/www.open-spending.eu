# Pre-commit hooks for the theme's PHP coding standard (.phpcs.xml.dist).
#
# One-time setup:
#   brew install pre-commit      # or: pipx install pre-commit
#   composer install             # provides vendor/bin/phpcbf + phpcs
#   pre-commit install
#
# On commit, phpcbf auto-fixes the staged PHP files; if it changes anything the
# commit stops so you can re-stage (git add -u) and commit again, after which
# phpcs confirms nothing non-fixable remains.
repos:
  - repo: local
    hooks:
      - id: phpcbf
        name: phpcbf (auto-fix WordPress coding standard)
        entry: vendor/bin/phpcbf
        language: system
        types: [php]
        exclude: '^(vendor|dist|node_modules|acf_json|dev)/'
      - id: phpcs
        name: phpcs (verify WordPress coding standard)
        entry: vendor/bin/phpcs
        language: system
        types: [php]
        exclude: '^(vendor|dist|node_modules|acf_json|dev)/'
