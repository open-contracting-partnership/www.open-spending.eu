ci:
  autoupdate_schedule: quarterly
repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.2
    hooks:
      - id: biome-check
  - repo: local
    hooks:
      - id: phpcbf
        name: phpcbf
        entry: vendor/bin/phpcbf
        language: system
        types: [php]
      - id: phpcs
        name: phpcs
        entry: vendor/bin/phpcs
        language: system
        types: [php]
      - id: check-assets
        name: check-assets
        entry: script/check-assets
        language: system
        # It reads the whole tree via git ls-files, so the changed-file list is
        # neither needed nor meaningful — deleting an image breaks a reference in
        # a file the commit does not touch.
        pass_filenames: false
        always_run: true
